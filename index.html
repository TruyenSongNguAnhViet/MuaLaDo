<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook Song Ngữ Anh - Việt | Interactive Dual-Language Ebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-glow: #6366f1;
            --accent-life: #10b981;
            --accent-mystery: #a855f7;
            --border-color: rgba(255, 255, 255, 0.1);
            --sidebar-width: 320px;
            --font-reader: 'Merriweather', serif;
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --reader-bg: #0f172a;
            --reader-text-en: #e2e8f0;
            --reader-text-vi: #38bdf8;
            --font-size: 17px;
            --line-height: 1.8;
        }

        /* Light Theme Variable Overrides */
        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #f1f5f9;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --reader-bg: #ffffff;
            --reader-text-en: #1e293b;
            --reader-text-vi: #0284c7;
        }

        /* Sepia Theme Variable Overrides */
        body.theme-sepia {
            --bg-primary: #fbf0d9;
            --bg-secondary: #f4e4bc;
            --bg-card: #eadeb8;
            --text-main: #433422;
            --text-sub: #7c6853;
            --border-color: rgba(67, 52, 34, 0.15);
            --reader-bg: #fbf0d9;
            --reader-text-en: #2d2113;
            --reader-text-vi: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background-color 0.3s, color 0.3s;
        }

        /* App Container Layout */
        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Sidebar Styles */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .toc-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin: 15px 0 8px 10px;
            font-weight: 700;
        }

        .toc-item {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .toc-item:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .toc-item.active {
            background: linear-gradient(135deg, var(--accent-glow), #4f46e5);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .toc-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* Main Reader Area */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--reader-bg);
            transition: background-color 0.3s;
        }

        /* Top Toolbar */
        .top-bar {
            height: 64px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-secondary);
            z-index: 5;
        }

        .bar-left, .bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            border-color: var(--accent-glow);
            color: var(--accent-glow);
            transform: translateY(-1px);
        }

        /* Mode Selector Switcher */
        .mode-switcher {
            display: flex;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-glow);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        /* Reading Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.1s ease;
        }

        /* Content Container */
        .reader-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            scroll-behavior: smooth;
        }

        .story-container {
            max-width: 800px;
            margin: 0 auto;
            font-family: var(--font-reader);
            font-size: var(--font-size);
            line-height: var(--line-height);
        }

        .story-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px dashed var(--border-color);
        }

        .story-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: var(--font-ui);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .tag-life {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tag-mystery {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .story-title-en {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .story-title-vi {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--reader-text-vi);
            font-style: italic;
        }

        /* Paragraph Block Styling */
        .para-block {
            margin-bottom: 24px;
            padding: 16px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            border-left: 3px solid transparent;
        }

        .para-block:hover {
            background-color: var(--bg-card);
            border-left-color: var(--accent-glow);
            transform: translateX(4px);
        }

        .para-block.speaking {
            background-color: rgba(99, 102, 241, 0.15);
            border-left-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .para-en {
            color: var(--reader-text-en);
            margin-bottom: 8px;
            display: block;
        }

        .para-vi {
            color: var(--reader-text-vi);
            font-size: 0.95em;
            display: block;
        }

        /* Display Modes Handling */
        .mode-en-only .para-vi { display: none !important; }
        .mode-vi-only .para-en { display: none !important; }

        /* Audio Indicator Badge */
        .audio-indicator {
            position: absolute;
            right: 12px;
            top: 12px;
            opacity: 0;
            font-size: 0.85rem;
            color: var(--accent-glow);
            transition: opacity 0.2s;
        }

        .para-block:hover .audio-indicator {
            opacity: 0.7;
        }

        .para-block.speaking .audio-indicator {
            opacity: 1;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Message / Moral Box */
        .message-box {
            margin-top: 50px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid var(--accent-glow);
            border-radius: 16px;
            position: relative;
        }

        .message-title {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-glow);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Floating Controls Bar (Bottom) */
        .bottom-nav {
            height: 60px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 5;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--accent-glow);
            color: white;
        }

        /* Auto Read FAB */
        .auto-play-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .auto-play-btn:hover {
            transform: scale(1.05);
        }

        /* Settings Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-secondary);
            width: 90%;
            max-width: 440px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-row {
            margin-bottom: 20px;
        }

        .setting-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .theme-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
        }

        .theme-btn.active {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            .mode-switcher span {
                display: none;
            }

            .story-title-en {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="theme-dark">

                </div>
            </div>
        </div>
    </div>

    <!-- Embedded Ebook Complete Dataset -->
    <script>
        const ebookData = {
            intro: {
                id: "intro",
                category: "intro",
                titleEn: "INTRODUCTION",
                titleVi: "LỜI GIỚI THIỆU",
                paragraphs: [
                    { en: "Have you ever realized that what makes us remember a language for a long time is never dry theoretical pages, but the flutter of emotion?", vi: "Có bao giờ bạn nhận ra, điều khiến ta nhớ lâu một ngôn ngữ chưa bao giờ là những trang lý thuyết khô khan, mà là sự rung động của cảm xúc?" },
                    { en: "When a vocabulary word or a sentence touches your heart, English is no longer a subject; it becomes part of your own experience.", vi: "Khi một từ vựng hay một câu văn chạm được vào trái tim, tiếng Anh không còn là môn học, nó trở thành một phần trải nghiệm của chính bạn." },
                    { en: "This small book was written from that wish: to help you gently absorb the language through every rhythm of words, side by side with smooth and natural English - Vietnamese lines.", vi: "Cuốn sách nhỏ này được viết ra từ mong muốn đó: giúp bạn nhẹ nhàng thẩm thấu ngôn ngữ qua từng nhịp điệu của câu chữ, song hành từng dòng Anh - Việt mượt mà và tự nhiên." },
                    { en: "10 stories below are 10 separate spaces, taking you through two nuances of life:", vi: "10 câu chuyện dưới đây là 10 khoảng không gian riêng biệt, đưa bạn đi qua hai sắc thái của cuộc sống:" },
                    { en: "05 love & life stories: Warm, gentle low notes about fatherhood, love, and homecoming. There, you accumulate subtle emotional expressions while finding healing for your soul.", vi: "05 câu chuyện tình cảm & cuộc sống: Là những nốt trầm ấm áp, dịu dàng về tình cha, tình yêu và sự trở về. Ở đó, bạn vừa tích lũy cách diễn đạt cảm xúc tinh tế, vừa tìm thấy sự chữa lành cho tâm hồn." },
                    { en: "05 spiritual & mystery stories: Thrilling, mysterious, and captivating dark shades. Unexpected twists will ignite curiosity, making your reading and learning exciting until the very last page.", vi: "05 câu chuyện tâm linh & trinh thám: Là những mảng tối ly kỳ, huyền bí và đầy cuốn hút. Những nút thắt bất ngờ sẽ thắp lên sự tò mò, khiến việc đọc và học của bạn trở nên hào hứng đến từng trang cuối cùng." },

                messageEn: "Enjoy every peaceful moment and immerse in the beauty of stories.",

            stories: [

                    paragraphs: [
                        { en: "Autumn in Hanoi always possesses a melancholic beauty, but for An, this year's autumn was nothing but a series of gray days.", vi: "Hà Nội vào thu luôn mang một vẻ đẹp buồn man mác, nhưng đối với An, mùa thu năm nay chỉ toàn là những chuỗi ngày xám xịt." },
                        { en: "The company laid off staff, and she lost her job at thirty.", vi: "Công ty cắt giảm nhân sự, và cô mất việc ở tuổi ba mươi." },

                        { en: "An felt like a dry leaf falling into a rushing stream, swaying without knowing where it would drift.", vi: "An cảm thấy mình như một chiếc lá khô rơi giữa dòng nước xiết, chao đảo không biết sẽ dạt về đâu." },
                        { en: "That afternoon, a sudden downpour struck.", vi: "Chiều hôm đó, trời đổ mưa rào đột ngột." },
                        { en: "An didn't have an umbrella, so she took shelter under the porch of an old bookstore deep in a small alley.", vi: "An không mang ô nên cô đành trú chân dưới hiên của một cửa hàng sách cũ nằm sâu trong ngõ nhỏ." },
                        { en: "The quiet wooden house, with the scent of old paper blending with the smell of damp earth after the rain, created a strange space, entirely detached from the rush of the city outside.", vi: "Căn nhà gỗ trầm mặc, mùi giấy cũ quyện với mùi đất ẩm sau mưa tạo nên một không gian kỳ lạ, tách biệt hẳn với sự hối hả của phố thị bên ngoài." },
                        { en: ""Come inside and sit down so you don't catch a cold, dear," a deep, warm voice spoke.", vi: ""Cháu vào trong ngồi cho khỏi lạnh," một giọng nói trầm ấm vang lên." },
                        { en: "An turned around and saw an elderly man with snow-white hair and kind eyes smiling at her. He was the owner of the bookstore.", vi: "An quay lại và thấy một cụ ông tóc bạc phơ, ánh mắt hiền từ đang mỉm cười với mình. Ông là chủ tiệm sách." },
                        { en: "An hesitated, then stepped inside.", vi: "An ngập ngừng, rồi bước vào." },
                        { en: "Her eyes inadvertently stopped at an old leather-bound book sitting on his workbench. Beside it was a steaming cup of chrysanthemum tea.", vi: "Ánh mắt cô vô tình dừng lại ở một cuốn sách bọc bìa da cũ kỹ đặt trên bàn làm việc của ông. Cạnh đó là một tách trà hoa cúc còn nghi ngút khói." },
                        { en: ""Rainy days like this often make people sad, don't they?" The old man said as he poured another cup of tea and handed it to An.", vi: ""Những ngày mưa như thế này thường làm người ta buồn, phải không cháu?" Cụ già vừa nói vừa rót thêm một tách trà nữa và đưa cho An." },
                        { en: "An took the warm cup, her heart suddenly heavy: "I feel like everything in my life is falling apart, sir. I don't know where to start again."", vi: "An nhận lấy tách trà ấm nóng, lòng bỗng chùng xuống: "Cháu cảm thấy mọi thứ trong cuộc sống của cháu đều đang đổ vỡ, bác ạ. Cháu không biết mình phải bắt đầu lại từ đâu."" },
                        { en: "The old man gently smiled and pointed out the window, where raindrops were relentlessly pounding against the glass:", vi: "Cụ già nhẹ nhàng mỉm cười và chỉ tay ra ngoài cửa sổ, nơi những giọt mưa đang đập liên hồi vào mặt kính:" },
                        { en: ""Do you know why plants grow greener after a heavy rain? Rain may break a few weak branches and wash away the dust that has accumulated for so long, but it also brings new life to the parched earth.", vi: ""Cháu có biết vì sao sau mỗi cơn mưa lớn, cây cối lại xanh tốt hơn không? Mưa có thể làm gãy vài cành lá yếu ớt và làm trôi đi lớp bụi bẩn bám dính bấy lâu, nhưng nó cũng mang lại sự sống mới cho mặt đất khô cằn." },
                        { en: "We humans are the same. Some failures and losses are not meant to destroy you, but to clear space for newer and better things to enter."", vi: "Con người chúng ta cũng vậy. Có những thất bại và mất mát không phải để hủy hoại cháu, mà là để dọn dẹp không gian cho những điều mới mẻ và tốt đẹp hơn bước vào."" },
                        { en: "Those simple words were like a cool stream watering An's parched soul.", vi: "Những lời nói đơn giản ấy như một dòng nước mát lành tưới tắm vào tâm hồn đang cằn cỗi của An." },
                        { en: "She looked out at the curtain of rain and took a deep breath.", vi: "Cô nhìn ra màn mưa và hít một hơi thật sâu." },
                        { en: "The smell of damp earth, the scent of rain, and the rich aroma of tea seemed to blend together, signaling a new beginning.", vi: "Mùi đất ẩm, mùi mưa, và hương trà thơm nồng như đang hòa quyện vào nhau, báo hiệu một sự khởi đầu mới." }
                    ],
                    messageEn: "Every storm runs out of rain, and after the rain, the sky will clear again. Losses in life are sometimes necessary preparations for you to welcome better things ahead. Do not fear change.",
                    messageVi: "Mọi giông bão rồi cũng sẽ tan, và sau cơn mưa trời lại sáng. Những mất mát trong cuộc sống đôi khi là sự chuẩn bị cần thiết để bạn đón nhận những điều tuyệt vời hơn ở phía trước. Đừng sợ hãi sự thay đổi."
                },
                {
                    id: "story-2",
                    category: "life",
                    titleEn: "Story 2: The Unwritten Letter",
                    titleVi: "Câu Chuyện 2: Lá Thư Chưa Gửi",
                    paragraphs: [
                        { en: "The rain in Seattle always sounded like a soft, unending sigh.", vi: "Cơn mưa ở Seattle lúc nào cũng nghe như một tiếng thở dài nhẹ nhàng, không bao giờ dứt." },
                        { en: "Ethan sat by the window, watching the drops race down the glass pane like tiny, lost memories.", vi: "Ethan ngồi bên cửa sổ, nhìn những giọt nước đua nhau lăn xuống mặt kính như những ký ức nhỏ bé, đi lạc." },
                        { en: "In his hands, he held an old, yellowed envelope that had remained unopened for fifteen years.", vi: "Trên tay anh là một phong bì cũ đã ngả vàng, vẫn chưa hề được mở ra suốt mười lăm năm qua." },
                        { en: "It belonged to his father, a man of few words and even fewer smiles.", vi: "Nó thuộc về cha anh, một người đàn ông kiệm lời và lại càng ít khi nở nụ cười." },
                        { en: "Growing up, Ethan always felt an invisible wall standing between him and his father, Thomas.", vi: "Suốt thời thơ ấu, Ethan luôn cảm thấy một bức tường vô hình sừng sững giữa anh và cha mình, ông Thomas." },
                        { en: "Thomas was a silent carpenter whose hands were rough, calloused, and constantly stained with wood varnish.", vi: "Thomas là một người thợ mộc lặng lẽ, sở hữu bàn tay thô ráp, chai sạn và luôn dính vết sơn bóng của gỗ." },
                        { en: "He never said "I love you," nor did he offer comforting hugs when Ethan stumbled.", vi: "Ông chưa bao giờ nói "Cha yêu con," cũng chẳng hề trao những cái ôm an ủi mỗi khi Ethan vấp ngã." },
                        { en: "Instead, he expressed his presence through the quiet rhythm of his workshop late into the night.", vi: "Thay vào đó, ông thể hiện sự hiện diện của mình qua nhịp điệu lặng lẽ phát ra từ xưởng mộc đến tận đêm muộn." },
                        { en: "When Ethan turned eighteen, a bitter argument over his future fractured their fragile relationship.", vi: "Năm Ethan mười tám tuổi, một cuộc tranh cãi nảy lửa về tương lai đã làm rạn nứt mối quan hệ vốn dĩ mỏng manh giữa hai người." },
                        { en: "Ethan wanted to pursue literature in the big city, while Thomas insisted he learn a practical trade.", vi: "Ethan muốn theo đuổi ngành văn học ở thành phố lớn, trong khi Thomas lại nhất quyết bắt anh học lấy một nghề thực tế." },
                        { en: ""Words cannot fill a stomach, Ethan," Thomas had said, his voice cold and unyielding.", vi: ""Chữ nghĩa không làm đầy cái bụng được đâu, Ethan," Thomas đã nói vậy, giọng ông lạnh lùng và không chút nhượng bộ." },
                        { en: "Angry and hurt, Ethan packed his bags the very next morning and left without looking back.", vi: "Giận dữ và tổn thương, Ethan xếp hành lý ngay sáng hôm sau và ra đi mà không một lần ngoảnh lại." },
                        { en: "For fifteen years, he built a life in Chicago as a successful editor, rarely making a phone call home.", vi: "Suốt mười lăm năm, anh xây dựng cuộc sống tại Chicago với tư cách một biên tập viên thành công, hiếm khi gọi một cuộc điện thoại về nhà." },
                        { en: "He convinced himself that he didn't need a father who couldn't understand his dreams.", vi: "Anh tự thuyết phục bản thân rằng mình không cần một người cha chẳng thể hiểu nổi những ước mơ của mình." },
                        { en: "Then, a sudden stroke took Thomas away on a cold November evening.", vi: "Rồi một cơn đột quỵ bất ngờ đã cướp Thomas đi vào một chiều tháng Mười Một lạnh giá." },
                        { en: "Ethan returned to his childhood home only to pack up the dusty belongings left behind.", vi: "Ethan trở về ngôi nhà thời thơ ấu chỉ để dọn dẹp những đồ đạc bám bụi còn sót lại." },
                        { en: "In the dusty corner of Thomas's workshop, tucked beneath a stack of oak boards, Ethan found the envelope.", vi: "Nơi góc bụi mờ trong xưởng mộc của Thomas, giấu bên dưới một chồng gỗ sồi, Ethan đã tìm thấy chiếc phong bì này." },
                        { en: "Written on the front in his father's unsteady handwriting were the words: "For my son, Ethan."", vi: "Viết ở mặt trước bằng nét chữ chệch choạc của cha anh là dòng chữ: "Gửi con trai, Ethan."" },
                        { en: "With trembling fingers, Ethan broke the aged wax seal and pulled out a stack of folded paper.", vi: "Với đôi tay run rẩy, Ethan bóc lớp nốt niêm phong bằng sáp đã cũ và rút ra một tập giấy gấp gọn." },
                        { en: ""Dear Ethan," the letter began. "If you are reading this, my silent days have finally come to an end."", vi: ""Ethan yêu quý," lá thư bắt đầu. "Nếu con đang đọc những dòng này, những ngày tháng lặng lẽ của cha cuối cùng cũng đã khép lại."" },
                        { en: ""I know you grew up thinking I was a hard man who carried no warmth in his heart."", vi: ""Cha biết con lớn lên và luôn nghĩ cha là một người đàn ông khắc nghiệt, không mang chút ấm áp nào trong tim."" },
                        { en: ""The truth is, I was terrified - terrified that a poor carpenter like me would fail to prepare you for a harsh world."", vi: ""Sự thật là, cha đã rất sợ hãi - sợ rằng một người thợ mộc nghèo như cha sẽ thất bại trong việc chuẩn bị cho con đối mặt với thế giới nghiệt ngã này."" },
                        { en: ""Every chair I carved, every table I sanded, was done with the hope that it would support your dreams."", vi: ""Mỗi chiếc ghế cha đẽo gọt, mỗi chiếc bàn cha chà nhám, đều được làm ra với hy vọng nó sẽ nâng đỡ cho những ước mơ của con."" },
                        { en: ""I saved every penny from my craft, not for myself, but to pay for your college tuition."", vi: ""Cha đã tiết kiệm từng đồng từ công việc thủ công của mình, không phải cho bản thân, mà là để trả tiền học phí đại học cho con."" },
                        { en: "Ethan froze, his heart dropping into a deep, painful void.", vi: "Ethan lặng người, trái tim anh như hẫng đi rơi vào một khoảng trống đau đớn." },
                        { en: "He remembered the surprise scholarship he received during his freshman year, which had covered all his expenses. It hadn't been an anonymous donor from the university; it had been his father, working extra shifts until dawn.", vi: "Anh nhớ lại khoản học bổng bất ngờ mà mình nhận được năm nhất, khoản tiền đã trang trải toàn bộ chi phí cho anh. Đó không phải là nhà tài trợ ẩn danh nào từ trường đại học; đó chính là cha anh, người đã làm thêm những ca đêm đến tận bình minh." },
                        { en: ""I was too proud to tell you, and too foolish to know how to bridge the distance between us," the letter continued.", vi: ""Cha đã quá tự cao để nói với con, và quá ngốc nghếch để biết làm sao xóa bỏ khoảng cách giữa hai chúng ta," lá thư tiếp tục." },
                        { en: ""I read all your published articles, Ethan. I cut them out from newspapers and kept them under my mattress. I was always proud of you, even when I didn't know how to say it."", vi: ""Cha đã đọc tất cả các bài báo được xuất bản của con, Ethan. Cha cắt chúng ra từ các tờ báo và cất dưới đệm ngủ của mình. Cha vẫn luôn tự hào về con, ngay cả khi cha không biết làm cách nào để nói ra điều đó."" },
                        { en: "Tears blurred Ethan's vision, dripping onto the yellowed paper and smudging the ink of his father's words.", vi: "Nước mắt làm mờ đi tầm mắt Ethan, nhỏ xuống tờ giấy đã ngả vàng và làm nhòe đi vết mực từ những dòng chữ của cha." },
                        { en: "He realized that silence had not been a lack of love, but a language he had been too blind to translate.", vi: "Anh nhận ra rằng sự im lặng chưa từng là sự thiếu vốn tình yêu, mà là một ngôn ngữ mà anh đã quá mù quáng để có thể dịch giải." },
                        { en: "The unspoken words of a father had finally reached him, fifteen years too late, yet right when he needed them most.", vi: "Những lời chưa từng cất lên của người cha cuối cùng cũng đã đến được với anh, muộn mất mười lăm năm, nhưng lại đúng vào lúc anh cần chúng nhất." },
                        { en: "Ethan pressed the letter against his chest, listening to the soft rain outside, finally letting go of the anger he had carried for so long.", vi: "Ethan áp lá thư vào ngực, lắng nghe tiếng mưa rơi nhẹ nhàng bên ngoài, cuối cùng cũng trút bỏ được sự giận dữ mà anh đã mang theo suốt một thời gian dài." },
                        { en: "He looked out into the grey afternoon, smiling through his tears, and softly whispered into the quiet room, "Thank you, Dad."", vi: "Anh nhìn ra buổi chiều xám xịt, mỉm cười qua hàng nước mắt, và khẽ thì thầm vào khoảng không lặng im của căn phòng, "Cảm ơn cha."" }
                    ],
                    messageEn: "Love does not always announce itself with sweet words or grand gestures. Sometimes, it lives quietly in the heavy silence of hard work, sacrificed dreams, and unsaid prayers. Speak your love today.",
                    messageVi: "Tình yêu không phải lúc nào cũng tự xưng tên bằng những lời ngọt ngào hay hành động phô trương. Đôi khi, nó lặng lẽ tồn tại trong sự im lặng trầm mặc của sự lao động vất vả, những ước mơ bị hy sinh. Hãy nói ra tình yêu ngay hôm nay."
                },
                {
                    id: "story-3",
                    category: "life",
                    titleEn: "Story 3: Coffee at 6 AM",
                    titleVi: "Câu Chuyện 3: Tách Cà Phê Lúc 6 Giờ Sáng",
                    paragraphs: [
                        { en: "Every morning for forty years, the small wooden table by the window of Café de L'Amour belonged to Arthur and Clara.", vi: "Mỗi buổi sáng suốt bốn mươi năm qua, chiếc bàn gỗ nhỏ bên cửa sổ của quán Café de L'Amour luôn thuộc về Arthur và Clara." },
                        { en: "At precisely six o'clock, Arthur would pull out the chair for his wife, smiling as she settled in with her favorite woolen shawl.", vi: "Đúng sáu giờ sáng, Arthur sẽ kéo ghế cho vợ mình, mỉm cười khi bà ngồi xuống cùng chiếc khăn choàng bằng len yêu thích." },
                        { en: "The waiter never needed to take their order. Two cups of black coffee, one spoonful of sugar for him, and a drop of condensed milk for her.", vi: "Người phục vụ chưa bao giờ cần phải hỏi họ gọi món gì. Hai tách cà phê đen, một muỗng đường cho ông, và một giọt sữa đặc dành cho bà." },
                        { en: "Their love story was not written in dramatic grand gestures or stormy passions.", vi: "Câu chuyện tình yêu của họ không được viết nên bằng những hành động phô trương kịch tính hay những đam mê dội sóng." },
                        { en: "It was woven from quiet routines, shared glances, and the comforting warmth of ceramic mugs held between cold hands.", vi: "Nó được dệt nên từ những thói quen bình lặng, những ánh nhìn trao nhau, và sự ấm áp dễ chịu của những tách gốm cầm trên tay giữa tiết trời lạnh giá." },
                        { en: "Clara was an artist who painted the world in vibrant watercolors, while Arthur was an accountant who found solace in numbers and order.", vi: "Clara là một họa sĩ tô điểm thế giới bằng những bức tranh màu nước rực rỡ, trong khi Arthur lại là một kế toán tìm thấy sự bình yên trong những con số và trật tự." },
                        { en: "Yet, when they sat together at 6 AM, their contrasting worlds merged into perfect harmony.", vi: "Thế nhưng, khi họ ngồi lại bên nhau lúc sáu giờ sáng, hai thế giới đối lập ấy lại hòa quyện thành một bản hòa tấu hoàn hảo." },
                        { en: "They would talk about everything and nothing - the morning news, the neighborhood stray cat, or the way the sunlight filtered through the autumn leaves.", vi: "Họ trò chuyện về mọi điều và chẳng về điều gì cả - những tin tức buổi sáng, chú mèo lang thang trong xóm, hay cách ánh nắng xuyên qua những chiếc lá mùa thu." },
                        { en: ""Promises are easy to make under a moonlit sky, Arthur," Clara used to say, resting her chin on her hand. "The real challenge is keeping them when the morning light arrives."", vi: ""Lời thề hẹn dưới trăng bao giờ cũng dễ dàng, Arthur à," Clara từng nói, cằm tựa lên bàn tay. "Thử thách thực sự là giữ trọn chúng khi ánh sáng bình minh bước tới."" },
                        { en: "Arthur would softly touch her hand and reply, "Then I promise to bring you coffee every morning light for the rest of my days."", vi: "Arthur sẽ khẽ chạm vào tay bà và đáp: "Vậy anh hứa sẽ mang cà phê đến cho em dưới mỗi ánh bình minh trong suốt phần đời còn lại của mình."" },
                        { en: "Time, however, is a thief that works in silence.", vi: "Thế nhưng, thời gian lại là một kẻ trộm lặng lẽ hành động." },
                        { en: "In their late seventies, memory began to slip away from Clara like sand through delicate fingers.", vi: "Ở độ tuổi gần tám mươi, ký ức bắt đầu vuột khỏi tay Clara như những hạt cát trôi qua kẽ tay mảnh mai." },
                        { en: "At first, it was simple things - where she had left her brushes, or the name of a distant cousin.", vi: "Ban đầu, đó chỉ là những điều đơn giản - bà đã để cọ vẽ ở đâu, hay tên của một người họ hàng xa." },
                        { en: "Then came the darker days, when Alzheimer's stole the names of her children, and eventually, the face of her husband.", vi: "Rồi đến những ngày u tối hơn, khi căn bệnh Alzheimer cướp đi tên của các con bà, và cuối cùng là khuôn mặt của người chồng." },
                        { en: "Some mornings, Clara would look at Arthur with blank, frightened eyes, asking who the strange man sitting across from her was.", vi: "Có những buổi sáng, Clara nhìn Arthur bằng đôi mắt trống rỗng, sợ hãi, hỏi người đàn ông lạ mặt đang ngồi đối diện với bà là ai." },
                        { en: "It broke Arthur's heart into a thousand sharp pieces, but his spirit never faltered.", vi: "Điều đó đập tan trái tim Arthur thành hàng ngàn mảnh sắc nhọn, nhưng tinh thần của ông chưa bao giờ gục ngã." },
                        { en: "Every single morning, despite the pain, he would gently walk her down the cobblestone street to Café de L'Amour at 6 AM.", vi: "Mỗi một buổi sáng, mặc cho nỗi đau, ông vẫn dịu dàng dắt bà đi dạo trên con đường đá hẻm đến quán Café de L'Amour lúc sáu giờ sáng." },
                        { en: "He would place the hot cup with a drop of milk in front of her, just as he had done for four decades.", vi: "Ông sẽ đặt tách cà phê nóng với một giọt sữa trước mặt bà, đúng như điều ông đã làm suốt bốn thập kỷ qua." },
                        { en: "One rainy Tuesday morning, Clara sat in her usual seat, staring blankly at the mist rising from her cup.", vi: "Một sáng thứ Ba mưa rơi, Clara ngồi ở chỗ cũ, ngơ ngác nhìn làn sương mờ bay lên từ tách cà phê." },
                        { en: "Arthur reached across the table and placed his weathered hand over hers.", vi: "Arthur vươn tay qua mặt bàn và đặt bàn tay từng trải của mình lên tay bà." },
                        { en: ""You don't know who I am today, do you, my love?" he asked softly, a tear threatening to spill from his tired eye.", vi: ""Hôm nay em không biết anh là ai, phải không, tình yêu của anh?" ông khẽ hỏi, một giọt nước mắt chực lăn trên bờ mi mệt mỏi." },
                        { en: "Clara turned her gaze toward him, staring intently into his warm, familiar brown eyes.", vi: "Clara quay ánh nhìn về phía ông, chăm chú nhìn vào đôi mắt nâu ấm áp, quen thuộc." },
                        { en: "She paused for a long moment, the noise of the coffee shop fading into a deep silence.", vi: "Bà khựng lại một lúc lâu, tiếng ồn ào của quán cà phê như lắng xuống trong không gian lặng im sâu thẳm." },
                        { en: "Then, a faint spark of recognition danced in her eyes, and a soft, sweet smile brushed across her lips.", vi: "Rồi, một tia sáng nhận ra mơ hồ nhảy múa trong mắt bà, và một nụ cười dịu dàng, ngọt ngào khẽ lướt qua làn môi." },
                        { en: ""I don't remember your name, old man," Clara whispered softly, wrapping her small hand around his fingers. "But I know that I am safe with you, and I know that this coffee tastes like home."", vi: ""Em không nhớ tên ông, ông lão ạ," Clara khẽ thì thầm, quấn bàn tay nhỏ nhắn của mình lấy những ngón tay ông. "Nhưng em biết em được an toàn khi ở bên ông, và em biết tách cà phê này mang hương vị của mái nhà."" },
                        { en: "Arthur let out a shaky breath, tears finally streaming down his wrinkled cheeks as he smiled back.", vi: "Arthur thở ra một hơi run rẩy, nước mắt cuối cùng cũng lăn dài trên đôi gò má nhăn nheo khi ông mỉm cười đáp lại." },
                        { en: "It didn't matter if her mind had lost the details of their past. Her heart still remembered the feeling of being loved.", vi: "Việc trí óc bà đã đánh mất những chi tiết của quá khứ không còn quan trọng nữa. Trái tim bà vẫn nhớ cảm giác được yêu thương." },
                        { en: "Love was not just a collection of memories stored in the brain; it was a sanctuary built within the soul.", vi: "Tình yêu không chỉ là một tập hợp ký ức được lưu giữ trong bộ não; nó là một thánh đường được xây dựng từ sâu thẳm tâm hồn." },
                        { en: "As long as the sun rose at 6 AM, Arthur knew he would be there, holding her hand, serving her coffee, and loving her through the mist of forgotten time.", vi: "Chỉ cần mặt trời vẫn mọc lúc 6 giờ sáng, Arthur biết ông sẽ vẫn ở đó, nắm lấy tay bà, trao bà tách cà phê, và yêu bà qua những làn sương mờ của thời gian bị lãng quên." }
                    ],
                    messageEn: "True love is not measured by how much you remember, but by how deeply you remain when everything else vanishes. Never underestimate the power of quiet consistency.",
                    messageVi: "Tình yêu chân thực không được đo đếm bằng việc bạn ghi nhớ được bao nhiêu, mà bằng việc bạn ở lại sâu đậm thế nào khi mọi thứ khác biến mất. Đừng bao giờ đánh giá thấp sức mạnh của sự kiên trì bình lặng."
                },
                {
                    id: "story-4",
                    category: "life",
                    titleEn: "Story 4: The Broken Violin",
                    titleVi: "Câu Chuyện 4: Cây Đàn Violin Vỡ",
                    paragraphs: [
                        { en: "The dusty stage of the abandoned theater smelled of old velvet and forgotten dreams.", vi: "Sân khấu bám bụi của nhà hát bị bỏ hoang bốc lên mùi nhung cũ và những ước mơ bị lãng quên." },
                        { en: "Julian stood in the center, staring at the shattered pieces of his grandfather's heirloom violin lying upon the wooden floorboards.", vi: "Julian đứng ở chính giữa, đăm đăm nhìn những mảnh vỡ nát của cây đàn violin gia truyền từ người ông đang nằm trên những tấm sàn gỗ." },
                        { en: "The accident had happened only an hour ago - a careless slip of his hand during a fit of rage and self-doubt.", vi: "Tai nạn vừa mới xảy ra cách đây một giờ - một sự trượt tay bất cẩn trong cơn giận dữ và sự hoài nghi bản thân." },
                        { en: "For months, Julian had struggled to compose the final piece for his debut concert, but the music inside him felt hollow and rigid.", vi: "Suốt nhiều tháng, Julian đã vật lộn để sáng tác bản nhạc cuối cùng cho buổi hòa nhạc ra mắt, nhưng âm nhạc bên trong anh cảm giác thật rỗng tuếch và cứng nhắc." },
                        { en: "In a moment of overwhelming frustration, he had thrown the instrument against the wall, breaking the delicate wooden body into pieces.", vi: "Trong một khoảnh khắc sụp đổ vì tuyệt vọng, anh đã ném cây đàn vào tường, đập tan phần thân gỗ mỏng manh thành vô số mảnh vụn." },
                        { en: "Now, the silence in the empty hall felt heavier than any failed melody he had ever played.", vi: "Giờ đây, sự im lặng trong khán phòng trống trải nghe còn nặng nề hơn bất kỳ giai điệu thất bại nào anh từng chơi." },
                        { en: ""A broken violin makes no noise, Julian, but a broken spirit destroys the musician entirely," a voice echoed from the shadows.", vi: ""Một cây đàn violin vỡ không phát ra tiếng động, Julian à, nhưng một tâm hồn tan vỡ lại hủy hoại hoàn toàn người nghệ sĩ," một giọng nói vang vọng từ trong bóng tối." },
                        { en: "It was Master Chen, the old instrument restorer who had watched Julian practice since he was a small boy.", vi: "Đó là Thầy Chen, người thợ phục chế nhạc cụ gia truyền cũ kỹ, người đã dõi theo Julian luyện tập từ khi anh còn là một cậu bé." },
                        { en: "The old man walked slowly toward the stage, kneeling down to carefully gather the polished pine fragments into his worn handkerchief.", vi: "Người đàn ông lớn tuổi chậm rãi bước về phía sân khấu, quỳ xuống cẩn thận gom những mảnh gỗ thông bóng bẩy vào chiếc khăn tay cũ kỹ." },
                        { en: ""I ruined it, Master," Julian whispered, his hands trembling as he stared at his empty palms. "It was perfect, and I destroyed it."", vi: ""Con đã phá hỏng nó rồi, Thầy ơi," Julian thì thầm, đôi tay run rẩy khi nhìn vào lòng bàn tay trống rỗng của mình. "Nó vốn hoàn hảo, và con đã hủy hoại nó."" },
                        { en: "Master Chen looked up, his eyes wise and calm despite the tragedy before them.", vi: "Thầy Chen ngước nhìn lên, đôi mắt ông thể hiện sự trí tuệ và bình thản dù trước mặt là một bi kịch." },
                        { en: ""Nothing made of wood and string remains untouched by time or hardship," Master Chen replied softly.", vi: ""Chẳng có thứ gì làm từ gỗ và dây đàn mà không bị thời gian hay gian khổ chạm đến," Thầy Chen dịu dàng đáp." },
                        { en: ""The beauty of music does not come from flawless wood, but from the story the player tells through the scars."", vi: ""Vẻ đẹp của âm nhạc không đến từ thanh gỗ không tì vết, mà đến từ câu chuyện người chơi kể qua những vết sẹo."" },
                        { en: "For three long weeks, Julian spent his days in Master Chen's small workshop, watching the old artisan work his magic.", vi: "Suốt ba tuần dài, Julian dành trọn những ngày tháng trong xưởng mộc nhỏ của Thầy Chen, nhìn người thợ thủ công già thể hiện phép thuật." },
                        { en: "Instead of hiding the cracks, Master Chen used a fine golden varnish to join the shattered pieces of the violin back together.", vi: "Thay vì che giấu những vết nứt, Thầy Chen sử dụng một lớp sơn bóng ngát vàng tinh xảo để gắn kết những mảnh vỡ của cây đàn lại với nhau." },
                        { en: "Golden lines ran across the surface of the instrument like glowing rivers of resilience.", vi: "Những đường chỉ vàng chạy ngang mặt nhạc cụ như những dòng sông kiên cường đang tỏa sáng." },
                        { en: ""When we repair what is broken with love and intention, the cracks become the most beautiful part of the piece," Chen explained.", vi: ""Khi chúng ta sửa chữa những gì đã vỡ bằng tình yêu và mục đích, những vết nứt sẽ trở thành phần đẹp nhất của tác phẩm," Chen giải thích." },
                        { en: "On the night of the grand concert, Julian walked onto the brightly lit stage carrying the scarred, gold-lined violin.", vi: "Vào đêm hòa nhạc lớn, Julian bước ra sân khấu rực rỡ ánh đèn, mang theo cây đàn violin chằng chịt vết sẹo được gắn chỉ vàng." },
                        { en: "The audience gasped softly at the sight of the altered instrument, whispering among themselves in confusion.", vi: "Khán giả khẽ trầm ồ trước hình ảnh chiếc nhạc cụ bị biến đổi, thì thầm bàn tán trong sự hoang mang." },
                        { en: "Julian closed his eyes, took a deep breath, and drew the bow across the tensioned strings.", vi: "Julian nhắm mắt lại, hít một hơi thật sâu, và kéo cây vĩ qua những sợi dây đang căng chặt." },
                        { en: "The note that emerged was unlike anything he had ever played before - rich, resonant, deep, and filled with profound vulnerability.", vi: "Nốt nhạc vang lên không giống bất kỳ điều gì anh từng chơi trước đây - trầm ấm, ngân vang, sâu lắng và đong đầy sự tổn thương sâu sắc." },
                        { en: "He played not with the fear of making mistakes, but with the freedom of someone who had embraced his own imperfections.", vi: "Anh không chơi với sự sợ hãi sẽ mắc lỗi, mà với sự tự do của một người đã ôm lấy những điều không hoàn hảo của chính mình." },
                        { en: "The music soared through the concert hall, painting pictures of struggle, loss, acceptance, and ultimate redemption.", vi: "Giai điệu bay vút qua khán phòng hòa nhạc, vẽ nên những bức tranh về sự đấu tranh, mất mát, chấp nhận, và sự cứu rỗi cuối cùng." },
                        { en: "When the final note faded into silence, the entire hall remained still for a breath before bursting into thunderous applause.", vi: "Khi nốt nhạc cuối cùng chìm vào lặng im, toàn bộ khán phòng lặng đi trong một nhịp thở trước khi bùng nổ trong tiếng pháo tay như sấm dội." },
                        { en: "Julian looked down at his violin, the golden seams gleaming under the spotlights like badges of honor.", vi: "Julian nhìn xuống cây đàn của mình, những đường nối bằng vàng lấp lánh dưới đèn chiếu như những huy hiệu vinh quang." },
                        { en: "He realized that his music had not grown despite the brokenness, but precisely because of it.", vi: "Anh nhận ra rằng âm nhạc của mình không phát triển bất chấp sự tan vỡ, mà chính vì sự tan vỡ đó." }
                    ],
                    messageEn: "Perfection is an illusion that often prevents us from creating our most authentic art and living our most genuine lives. Embrace your broken pieces and allow your healed scars to play the most powerful song.",
                    messageVi: "Sự hoàn hảo là một ảo tưởng thường ngăn cản chúng ta tạo ra nghệ thuật chân thực nhất và sống một cuộc đời nguyên bản nhất. Hãy ôm lấy những mảnh vỡ của bạn và cho phép những vết sẹo cất lên bản nhạc mạnh mẽ nhất."
                },
                {
                    id: "story-5",
                    category: "life",
                    titleEn: "Story 5: The Last Train Home",
                    titleVi: "Câu Chuyện 5: Chuyến Tàu Cuối Cùng Về Nhà",
                    paragraphs: [
                        { en: "The metallic chime of Platform 4 echoed through the freezing midnight air of Saint-Jude Station.", vi: "Tiếng chuông kim loại của Ga số 4 vang vọng qua không khí giá lạnh lúc nửa đêm tại Ga Saint-Jude." },
                        { en: "Leo wrapped his coat tighter around his neck, watching his breath turn into white mist in the dim fluorescent light.", vi: "Leo quấn chặt chiếc áo khoác quanh cổ, nhìn hơi thở của mình biến thành làn sương trắng dưới ánh đèn huỳnh quang mờ nhạt." },
                        { en: "It was 11:45 PM on Christmas Eve, and he had missed every earlier train after an unexpected software crash at his downtown office.", vi: "Đã là 11 giờ 45 phút đêm Giao thừa, và anh đã bỏ lỡ mọi chuyến tàu sớm hơn sau một sự cố phần mềm đột ngột tại văn phòng khu trung tâm." },
                        { en: "Exhausted, demoralized, and carrying a heavy briefcase of unfinished reports, he stepped into the near-empty last carriage of the 11:50 express.", vi: "Kiệt sức, chán nản và mang theo chiếc vali nặng trĩu những bản báo cáo chưa hoàn thành, anh bước vào toa tàu cuối cùng gần như trống rỗng của chuyến tàu tốc hành 11 giờ 50." },
                        { en: "The doors hissed shut, cutting off the biting wind outside as the train slowly lurched forward into the dark tunnel.", vi: "Cánh cửa rít lên rồi đóng lại, ngăn cắt cơn gió rét buốt bên ngoài khi chuyến tàu chậm rãi chuyển mình lao vào đường hầm tối om." },
                        { en: "In the corner seat across from him sat an elderly woman knitting a scarf with vibrant yellow yarn.", vi: "Ở ghế góc đối diện với anh là một phụ nữ lớn tuổi đang đan một chiếc khăn quàng cổ bằng sợi len màu vàng rực rỡ." },
                        { en: "Her face was a portrait of gentle serenity, completely untouched by the exhaustion that seemed to burden every other commuter in the city.", vi: "Khuôn mặt bà là một bức tranh của sự thanh thản dịu dàng, hoàn toàn không bị ảnh hưởng bởi sự mệt mỏi vốn như đang đè nặng lên mọi người đi làm ở thành phố này." },
                        { en: ""Running late on a night meant for family, son?" she asked softly, her knitting needles clicking in a soothing, rhythmic cadence.", vi: ""Về muộn vào một tối dành cho gia đình sao, con trai?" bà khẽ hỏi, những chiếc kim đan của bà gõ vào nhau theo một nhịp điệu êm ái, thư thái." },
                        { en: "Leo sighed, rubbing his aching eyes. "Work doesn't recognize holidays, ma'am. If I don't finish these files by morning, my promotion is gone."", vi: "Leo thở dài, dụi đôi mắt đau nhức. "Công việc không biết đến ngày lễ đâu, thưa bà. Nếu cháu không hoàn thành những hồ sơ này trước buổi sáng, thăng tiến của cháu sẽ tiêu tan."" },
                        { en: "The woman paused her work, looking at him with eyes full of quiet understanding.", vi: "Người phụ nữ dừng công việc của mình, nhìn anh bằng đôi mắt đong đầy sự hiểu biết thầm lặng." },
                        { en: ""Ah, the promotion," she murmured, a gentle smile tracing her lips. "I used to chase those titles too, forty years ago when I managed an agency. I missed my daughter's first steps, her school plays, and five Christmas dinners because of 'urgent deadlines.'"", vi: ""Ôi, việc thăng tiến," bà thì thầm, một nụ cười dịu dàng lướt qua làn môi. "Bà cũng từng đuổi theo những chức danh đó, bốn mươi năm trước khi bà quản lý một đại lý. Bà đã bỏ lỡ những bước đi đầu tiên của con gái mình, những buổi diễn ở trường của nó, và năm bữa tối Giáng sinh vì những 'deadline khẩn cấp'."" },
                        { en: "Leo looked up from his glowing laptop screen, caught off guard by the melancholy depth in her voice.", vi: "Leo ngước nhìn lên từ màn hình máy tính đang sáng rực, bị bất ngờ bởi chiều sâu trầm lắng trong giọng nói của bà." },
                        { en: ""And do you regret working hard?" Leo asked, his finger hovering over the keyboard.", vi: ""Và bà có hối hận vì đã làm việc chăm chỉ không?" Leo hỏi, ngón tay anh lơ lửng trên bàn phím." },
                        { en: ""I regret mistaking urgent things for important things," the old woman answered, resuming her rhythm.", vi: ""Bà hối hận vì đã nhầm lẫn những điều khẩn cấp với những điều quan trọng," người phụ nữ lớn tuổi trả lời, tiếp tục nhịp đan của mình." },
                        { en: ""Urgent things demand your time today, but important things - like love, health, and presence - build your life tomorrow. When you reach the end of your track, no company spreadsheet will sit by your bedside to hold your hand."", vi: ""Những điều khẩn cấp đòi hỏi thời gian của con hôm nay, nhưng những điều quan trọng - như tình yêu, sức khỏe và sự hiện diện - mới xây dựng nên cuộc sống của con ngày mai. Khi con đi đến cuối con đường của mình, không một bảng tính công ty nào sẽ ngồi bên giường bệnh để nắm lấy tay con đâu."" },
                        { en: "Her words hung in the warm, swaying air of the train carriage, sinking deep into Leo's tired conscience.", vi: "Những lời của bà lơ lửng trong không khí ấm áp, lắc lư của toa tàu, thấm sâu vào tâm trí mệt mỏi của Leo." },
                        { en: "He thought of his mother waiting at home with a warmed-up dinner, and his younger sister who had texted him five times asking when he would be back.", vi: "Anh nghĩ đến người mẹ đang chờ ở nhà với bữa tối đã được hâm nóng, và cô em gái nhỏ đã nhắn tin cho anh năm lần hỏi khi nào anh mới về." },
                        { en: "He closed the laptop lid, letting the blue light fade into the soft amber lighting of the carriage.", vi: "Anh đóng nắp máy tính lại, để ánh sáng màu xanh phai dần vào ánh đèn màu hồ phách dịu nhẹ của toa tàu." },
                        { en: "The train screeched to a halt at his suburban station, the automated voice announcing his arrival.", vi: "Chuyến tàu rít lên dừng lại tại ga ngoại ô của anh, giọng nói tự động thông báo chuyển đến." },
                        { en: "Leo stood up, turned to the elderly woman, and smiled from the bottom of his heart. "Thank you. Merry Christmas."", vi: "Leo đứng dậy, quay sang người phụ nữ lớn tuổi, và mỉm cười từ tận đáy lòng. "Cảm ơn bà. Chúc bà Giáng sinh an lành."" },
                        { en: ""Merry Christmas, son," she replied, cutting the yellow yarn and holding up the completed scarf. "Now go home to the people who matter."", vi: ""Giáng sinh an lành, con trai," bà đáp, cắt sợi len màu vàng và giơ chiếc khăn đã hoàn thành lên. "Bây giờ hãy về nhà với những người quan trọng đi."" },
                        { en: "As Leo stepped onto the snowy platform, watching the red taillights of the train disappear into the night, he felt lighter than he had in years.", vi: "Khi Leo bước lên sân ga ngập tuyết, nhìn những chiếc đèn hậu màu đỏ của chuyến tàu biến mất vào đêm tối, anh cảm thấy nhẹ nhõm hơn nhiều năm qua." },
                        { en: "He walked out into the crisp air, leaving his work behind, ready to celebrate what truly mattered.", vi: "Anh bước ra không khí trong lành, để lại công việc phía sau, sẵn sàng đón mừng những điều thực sự có ý nghĩa." }
                    ],
                    messageEn: "Never confuse career urgency with life priority; deadlines pass, but moments with loved ones cannot be reclaimed. Make time for the people who make your life worth living.",
                    messageVi: "Đừng bao giờ nhầm lẫn sự khẩn cấp của sự nghiệp với ưu tiên của cuộc sống; các deadline rồi sẽ qua đi, nhưng những khoảnh khắc bên người thân yêu thì không thể lấy lại. Hãy dành thời gian cho người làm cuộc sống của bạn đáng sống."
                },
                {
                    id: "story-6",
                    category: "mystery",
                    titleEn: "Story 6: The Clockwork Doll",
                    titleVi: "Câu Chuyện 6: Búp Bê Dây Cót",
                    paragraphs: [
                        { en: "The rain poured heavily over the Victorian mansion on Blackwood Hill, washing away the blood tracks outside the master bedroom.", vi: "Cơn mưa trút xuống xối xả trên căn biệt thự phong cách Victoria trên đồi Blackwood, rửa trôi những vệt máu bên ngoài phòng ngủ chính." },
                        { en: "Detective Julian adjusted his trench coat, stepping carefully over the shattered glass scattered across the Persian rug.", vi: "Thám tử Julian chỉnh lại chiếc áo khoác dáng dài, cẩn trọng bước qua những mảnh kính vỡ văng vãi khắp tấm thảm Ba Tư." },
                        { en: "Lord Archibald, a wealthy collector of antique machinery, lay dead in his leather armchair, his chest pierced by a silver letter opener.", vi: "Ngài Archibald, một nhà sưu tầm máy móc cổ giàu có, đã chết gục trên chiếc ghế bành bọc da, lồng ngực bị đâm xuyên bởi một con dao rọc thư bằng bạc." },
                        { en: "The room was locked from the inside, with no signs of forced entry, creating an impossible crime scene.", vi: "Căn phòng được khóa kín từ bên trong, không có dấu hiệu đột nhập, tạo nên một hiện trường vụ án không tưởng." },
                        { en: "In the far corner of the dimly lit room sat Archibald's prized possession: a life-sized clockwork porcelain doll dressed in velvet.", vi: "Nơi góc khuất mờ tối của căn phòng là tài sản quý giá nhất của Archibald: một con búp bê sứ chạy dây cót kích thước như người thật mặc đầm nhung." },
                        { en: "Its painted blue eyes stared blankly into the dark, and its porcelain cheeks reflected the flickering candlelight.", vi: "Đôi mắt vẽ màu xanh lục bảo của nó nhìn chằm chằm vào khoảng trống, và đôi gò má sứ phản chiếu ánh nến chập chờn." },
                        { en: ""The servants claim they heard the sound of mechanical ticking right before the scream, Detective," Officer Miller whispered, shivering slightly.", vi: ""Những người làm tuyên bố họ nghe thấy tiếng tích tắc của máy móc ngay trước tiếng la hét, thưa Thám tử," Viên cảnh sát Miller thì thầm, khẽ rùng mình." },
                        { en: "Julian approached the doll, noticing a faint, greasy residue on its delicate porcelain fingers.", vi: "Julian tiến lại gần con búp bê, nhận thấy một vết dầu nhờn mờ nhạt trên những ngón tay sứ mảnh mai." },
                        { en: "He knelt down and inspected the winding key sticking out of the doll's back; it was turned completely counterclockwise.", vi: "Anh quỳ xuống và kiểm tra chiếc chìa khóa dây cót nhô ra từ lưng con búp bê; nó đã được vặn ngược chiều kim đồng hồ hoàn toàn." },
                        { en: ""This doll hasn't been wound up in decades, sir," Miller added. "The mechanism inside was ruined by rust."", vi: ""Con búp bê này chưa hề được lên dây cót suốt nhiều thập kỷ qua, sếp ạ," Miller nói thêm. "Bộ máy bên trong đã bị hỏng do gỉ sét."" },
                        { en: "Julian didn't answer. He pulled out his magnifying glass and examined the bloody letter opener sticking out of the corpse.", vi: "Julian không trả lời. Anh rút kính lúp ra và kiểm tra con dao rọc thư dính máu đang cắm trên thi thể." },
                        { en: "The angle of the strike was unnatural, driving downward from above with mechanical precision and inhuman strength.", vi: "Góc đâm thật bất thường, cắm thẳng từ trên xuống với độ chính xác như máy móc và một sức mạnh không phải của con người." },
                        { en: "Suddenly, the silent room was filled with a sharp, metallic click, followed by the slow, rhythmic ticking of internal gears.", vi: "Bất ngờ, căn phòng im lìm tràn ngập một tiếng tách kim loại sắc lẹm, tiếp theo là tiếng tích tắc nhịp nhàng của bánh răng bên trong." },
                        { en: "Miller jumped back, drawing his revolver, his knuckles turning white as he pointed the gun at the porcelain figure.", vi: "Miller giật nảy người lùi lại, rút khẩu súng ngắn của mình ra, các khớp ngón tay trắng bệch khi chĩa súng vào bức tượng sứ." },
                        { en: "The doll's head slowly jerked to the left, its jointed neck squeaking with the sound of grinding rust and dry metal.", vi: "Đầu con búp bê chậm rãi giật sang trái, chiếc cổ có khớp nối kêu lách cách với âm thanh của gỉ sét và kim loại khô khốc." },
                        { en: "Its glass eyes rolled upward, fixing their cold, lifeless gaze directly upon Detective Julian's face.", vi: "Đôi mắt kính của nó đảo lên trên, cố định ánh nhìn lạnh lẽo, không sức sống trực diện vào mặt Thám tử Julian." },
                        { en: ""It's... it's moving!" Miller stammered, his breath catching in his throat as the doll's porcelain mouth clicked open.", vi: ""Nó... nó đang chuyển động!" Miller lắp bắp nói, hơi thở nghẹn lại nơi cổ họng khi khuôn miệng sứ của con búp bê búng mở." },
                        { en: "A faint, distorted music box melody began to play from deep within the doll's hollow torso, playing a haunting lullaby.", vi: "Một giai điệu hộp nhạc méo mó, mờ nhạt bắt đầu cất lên từ sâu bên trong khuôn ngực rỗng của con búp bê, phát ra một bài hát ru rợn người." },
                        { en: "Julian remained still, watching closely as a tiny compartment in the doll's wooden base slid open with a soft hiss.", vi: "Julian vẫn đứng yên, quan sát kỹ lưỡng khi một ngăn nhỏ ở phần bệ gỗ của con búp bê trượt mở ra với một tiếng rít nhẹ." },
                        { en: "Inside lay a small, blood-stained velvet ribbon, matching the missing piece from the victim's secret diary hidden in the desk.", vi: "Bên trong là một dải ruy băng bằng nhung nhỏ dính máu, trùng khớp với mảnh còn thiếu từ cuốn nhật ký bí mật của nạn nhân bị giấu trong bàn làm việc." },
                        { en: "The diary revealed that twenty years ago, Archibald had built the doll using the ashes of his murdered business partner to bind her soul inside.", vi: "Cuốn nhật ký tiết lộ rằng hai mươi năm trước, Archibald đã chế tạo con búp bê bằng cách sử dụng tro cốt của người đối tác bị ông ta sát hại để giam cầm linh hồn cô ấy bên trong." },
                        { en: "He believed the mechanical body would contain her vengeful spirit, keeping his dark secret safe forever within the glass and porcelain frame.", vi: "Ông ta tin rằng cơ thể cơ khí kia sẽ kiềm chế được linh hồn báo thù của cô, giữ cho bí mật đen tối của ông ta an toàn mãi mãi trong khung kính và sứ." },
                        { en: ""The crime wasn't committed by a living intruder," Julian whispered, watching the doll's hands drop limply back to its sides as the music stopped.", vi: ""Vụ án không được thực hiện bởi một kẻ đột nhập còn sống," Julian thì thầm, nhìn đôi tay con búp bê buông thõng trở lại hai bên hông khi bản nhạc dừng lại." },
                        { en: ""The clockwork didn't move the doll... the spirit moved the clockwork to exact her final retribution."", vi: ""Bộ máy dây cót không làm chuyển động con búp bê... mà chính linh hồn đã vận hành bộ máy để thực hiện sự trả thù cuối cùng."" },
                        { en: "The room fell into absolute silence once more, leaving only the sound of rain beating against the glass pane.", vi: "Căn phòng rơi vào sự im lặng tuyệt đối một lần nữa, chỉ còn lại tiếng mưa đập liên hồi vào mặt kính." },
                        { en: "The doll's eyes slowly faded back into empty glass, its vengeance finally completed after decades of mechanical imprisonment.", vi: "Đôi mắt con búp bê chậm rãi mờ dần trở lại thành lớp kính trống rỗng, sự trả thù của nó cuối cùng đã hoàn thành sau nhiều thập kỷ bị giam cầm trong thân xác máy móc." }
                    ],
                    messageEn: "No secret remains buried forever, and no crime can escape the patient reach of justice, whether living or spiritual.",
                    messageVi: "Không có bí mật nào bị chôn vùi mãi mãi, và không có tội ác nào có thể thoát khỏi sự truy đuổi kiên trì của công lý, dù là ở đời thực hay thế giới tâm linh."
                },
                {
                    id: "story-7",
                    category: "mystery",
                    titleEn: "Story 7: Whispers Beneath the Floorboards",
                    titleVi: "Câu Chuyện 7: Lời Thì Thầm Dưới Sàn Nhà",
                    paragraphs: [
                        { en: "The old Blackwood Estate had been abandoned for three decades before Arthur bought it at a bank auction.", vi: "Khu điền trang Blackwood cũ kỹ đã bị bỏ hoang suốt ba thập kỷ trước khi Arthur mua lại nó trong một cuộc đấu giá của ngân hàng." },
                        { en: "As an architect fascinated by Victorian structures, he ignored the local rumors about the house being cursed.", vi: "Là một kiến trúc sư đam mê các công trình thời Victoria, anh phớt lờ những tin đồn địa phương về việc ngôi nhà bị nguyền rủa." },
                        { en: "On his first night alone in the master bedroom, the rain hammered relentlessly against the tall stained-glass windows.", vi: "Trong đêm đầu tiên ở một mình tại phòng ngủ chính, cơn mưa đập xối xả vào những ô cửa kính màu cao vút." },
                        { en: "At precisely midnight, a faint, rhythmic scratching sound echoed from directly beneath the wooden floorboards.", vi: "Đúng nửa đêm, một tiếng cào nhẹ, có nhịp điệu vang vọng lên từ ngay bên dưới những tấm sàn gỗ." },
                        { en: "Arthur froze under his blanket, listening closely as the sound transformed into a low, metallic scraping.", vi: "Arthur bất động dưới chăn, lắng nghe kỹ khi âm thanh biến thành tiếng sột soạt kim loại trầm trầm." },
                        { en: ""Help us... it's so cold down here..." a raspy child's voice whispered from the darkness below his bed.", vi: ""Cứu chúng cháu với... dưới này lạnh lắm..." một giọng trẻ con khàn khàn thì thầm từ bóng tối bên dưới giường anh." },
                        { en: "Heart pounding, Arthur grabbed his heavy flashlight and peered into the dusty gap between the floor frame and the rug.", vi: "Tim đập liên hồi, Arthur vơ lấy chiếc đèn pin nặng và nhìn vào khoảng trống bám bụi giữa khung sàn và tấm thảm." },
                        { en: "Nothing was there except decades of cobwebs and dead beetles, yet the icy breeze against his ankles was unmistakable.", vi: "Chẳng có gì ở đó ngoại trừ những lớp màng nhện hàng thập kỷ và lũ bọ chết, thế nhưng làn gió lạnh như băng lướt qua cổ chân anh là điều không thể nhầm lẫn." },
                        { en: "The next morning, driven by a mixture of terror and obsession, Arthur hired workers to pry open the master bedroom floor.", vi: "Sáng hôm sau, bị thúc đẩy bởi sự kết hợp giữa nỗi sợ hãi và sự ám ảnh, Arthur đã thuê thợ cạy mở sàn phòng ngủ chính." },
                        { en: "Beneath the polished mahogany wood laid a hidden brick staircase leading down into an unmapped cellar chamber.", vi: "Bên dưới lớp gỗ gụ bóng bẩy là một cầu thang gạch ẩn dẫn xuống một căn phòng hầm không có trên bản đồ." },
                        { en: "The air down there smelled of damp earth, copper, and something long forgotten by the light of day.", vi: "Không khí dưới đó bốc mùi đất ẩm, mùi đồng và một thứ gì đó đã bị ánh sáng mặt trời lãng quên từ lâu." },
                        { en: "At the center of the damp stone room sat a rusted iron cage containing two small, tarnished silver lockets.", vi: "Ở chính giữa căn phòng đá ẩm ướt là một chiếc lồng sắt gỉ sét chứa hai chiếc mặt dây truyền bằng bạc đã xỉn màu." },
                        { en: "Inside the lockets were portraits of two young girls who had mysteriously vanished from the estate in 1954.", vi: "Bên trong những chiếc mặt dây truyền là chân dung của hai cô bé từng mất tích một cách bí ẩn khỏi khu điền trang vào năm 1954." },
                        { en: "Police archives later revealed that the original owner had buried his daughters alive to hide his dark occult rituals.", vi: "Lưu trữ của cảnh sát sau đó tiết lộ rằng chủ sở hữu ban đầu đã chôn sống các con gái của mình để che giấu các nghi lễ tà thuật đen tối." },
                        { en: "Arthur realized the whispers were not malevolent threats, but desperate pleas for someone to finally reveal their grave.", vi: "Arthur nhận ra những lời thì thầm không phải là lời đe dọa độc ác, mà là những lời cầu xin tuyệt vọng để ai đó cuối cùng cũng khai quật được ngôi mộ của họ." },
                        { en: "After giving the remains a proper burial in the sunlight, the cold breeze disappeared, leaving the old house in eternal peace.", vi: "Sau khi trao cho hài cốt một lễ an táng đàng hoàng dưới ánh mặt trời, làn gió lạnh đã biến mất, trả lại cho ngôi nhà cũ sự bình yên vĩnh cửu." }
                    ],
                    messageEn: "Some shadows do not linger to harm us, but to speak the truths that the living were too cowardly to acknowledge. Listen closely to the quiet warnings.",
                    messageVi: "Một số bóng đen không ở lại để hại chúng ta, mà để nói lên những sự thật mà người sống đã quá hèn nhát không dám thừa nhận. Hãy lắng nghe kỹ những lời cảnh báo bình lặng."
                },
                {
                    id: "story-8",
                    category: "mystery",
                    titleEn: "Story 8: The Midnight Passenger",
                    titleVi: "Câu Chuyện 8: Hành Khách Lúc Nửa Đêm",
                    paragraphs: [
                        { en: "The rain beat a relentless tattoo against the windshield of Victor's yellow cab as he navigated the desolate coastal highway.", vi: "Mưa đập liên hồi như một bản nhạc dồn dập vào kính chắn gió chiếc xe taxi màu vàng của Victor khi anh lái xe qua con đường cao tốc ven biển vắng ngắt." },
                        { en: "It was 2:15 AM, the hour when the line between the living and the forgotten blurred into thick sea fog.", vi: "Lúc đó là 2 giờ 15 phút sáng, thời điểm mà ranh giới giữa người sống và những kẻ bị lãng quên mờ đi trong làn sương mù biển đặc quánh." },
                        { en: "He was ready to call it a night when a solitary figure emerged from the shadow of a rusted bus stop.", vi: "Anh đã sẵn sàng nghỉ ca thì một bóng người đơn độc bước ra từ bóng tối của một trạm xe buýt gỉ sét." },
                        { en: "The passenger was a young woman wearing a soaked trench coat, holding no umbrella, her dark hair plastered across her pale face.", vi: "Hành khách là một phụ nữ trẻ mặc chiếc áo khoác dáng dài ướt đẫm, không cầm ô, mái tóc đen dính chặt vào khuôn mặt tái nhợt." },
                        { en: "Victor pulled over, unlocking the back door with a sharp click: "Tough night for a walk, miss. Where to?"", vi: "Victor tấp xe vào lề, mở khóa cửa sau với một tiếng tách gọn lẹ: "Đêm hôm thế này mà đi bộ thì vất vả quá, cô ơi. Cô muốn về đâu?"" },
                        { en: "She slid into the backseat without making a sound, bringing with her an unnatural chill that smelled faintly of salt water and jasmine.", vi: "Cô lướt vào ghế sau mà không gây ra một tiếng động nào, mang theo một làn khí lạnh bất thường phảng phất mùi nước biển và hoa nhài." },
                        { en: ""The old lighthouse at Blackwood Point, please," she whispered, her voice like wind blowing through dry autumn leaves.", vi: ""Cho tôi đến ngọn hải đăng cũ ở Mũi Blackwood, làm ơn," cô thì thầm, giọng nói như tiếng gió thổi qua những chiếc lá thu khô." },
                        { en: "Victor frowned, glancing at her through the rearview mirror; her eyes were fixed straight ahead, utterly unblinking.", vi: "Victor nhíu mày, nhìn cô qua gương chiếu hậu; đôi mắt cô cố định nhìn thẳng về phía trước, hoàn toàn không chớp." },
                        { en: ""Nobody lives up there anymore, miss. They shut that lighthouse down after the storm five years ago," he warned, stepping on the gas.", vi: ""Không còn ai sống trên đó nữa đâu, cô ơi. Người ta đã đóng cửa ngọn hải đăng đó sau trận bão mười lăm năm trước rồi," anh cảnh báo, vặn ga." },
                        { en: "The passenger didn't reply, remaining motionlessly folded in the shadows of the backseat as the rain intensified.", vi: "Vị hành khách không đáp lại, vẫn ngồi bất động thu mình trong bóng tối của ghế sau khi cơn mưa ngày càng nặng hạt." },
                        { en: "As they approached the winding cliffside road, Victor tried making small talk to cut through the suffocating silence.", vi: "Khi họ đến gần con đường đèo quanh co bên bờ vực, Victor cố bắt chuyện để xua đi sự im lặng ngột ngạt." },
                        { en: ""I remember that storm," Victor muttered. "A young girl drove off the cliff that night... they never found her car."", vi: ""Tôi còn nhớ trận bão đó," Victor lẩm bẩm. "Một cô gái trẻ đã lao xe xuống vực đêm đó... người ta chưa bao giờ tìm thấy xe của cô ấy."" },
                        { en: "Suddenly, the temperature inside the cab plunged below freezing, causing Victor's breath to bloom into thick white clouds.", vi: "Bất ngờ, nhiệt độ bên trong xe taxi giảm xuống dưới mức đóng băng, khiến hơi thở của Victor biến thành những làn sương trắng đặc." },
                        { en: "He glanced at the rearview mirror again, and a jolt of pure terror shot through his spine - the backseat was completely empty.", vi: "Anh nhìn lại vào gương chiếu hậu một lần nữa, và một luồng sợ hãi tột cùng chạy dọc sống lưng - hàng ghế sau hoàn toàn trống rỗng." },
                        { en: "Panicking, he slammed on the brakes, the tires screeching violently as the cab skidded to a halt mere inches from the cliff edge.", vi: "Trong cơn hoảng loạn, anh đạp mạnh phanh, lốp xe rít lên dữ dội khi chiếc taxi trượt dài rồi dừng lại chỉ cách mép vực vài inch." },
                        { en: "He spun around in his seat: no trace of the woman remained, except for a pool of ocean water on the floor mat and a wet silver locket.", vi: "Anh xoay người lại trên ghế: không còn dấu vết nào của người phụ nữ, ngoại trừ một vũng nước biển trên thảm lót sàn và một chiếc mặt dây chuyền bằng bạc ướt đẫm." },
                        { en: "He picked up the locket with trembling hands; inside was a picture of the passenger, alongside a carved date: September 14, 2021.", vi: "Anh nhặt chiếc mặt dây chuyền lên bằng đôi tay run rẩy; bên trong là hình ảnh của vị hành khách, cùng một ngày được khắc: Ngày 14 tháng 9 năm 2021." },
                        { en: "Victor swallowed hard, looking out into the stormy abyss below where the waves crashed violently against the jagged rocks.", vi: "Victor nuốt bọt một cách khó khăn, nhìn ra vực sâu giông bão bên dưới nơi những ngọn sóng đập dữ dội vào những phiến đá nham nhở." },
                        { en: "She hadn't boarded his cab to get home; she was repeating her final journey on the anniversary of her death, warning drivers to stop before the edge.", vi: "Cô không lên xe taxi của anh để về nhà; cô đang lặp lại hành trình cuối cùng của mình vào đúng ngày giỗ, cảnh báo những người lái xe dừng lại trước bờ vực." }
                    ],
                    messageEn: "Some lost souls wander the earth not out of malice, but to prevent others from sharing their tragic fate. Listen to the subtle warnings life places in your path.",
                    messageVi: "Một số linh hồn lạc lối đi lang thang trên trái đất không phải vì lòng ác nghiệt, mà để ngăn những người khác không gặp phải số phận bi thảm như họ. Hãy lắng nghe những lời cảnh báo ngầm."
                },
                {
                    id: "story-9",
                    category: "mystery",
                    titleEn: "Story 9: The Mirror in Room 404",
                    titleVi: "Câu Chuyện 9: Tấm Gương Phòng 404",
                    paragraphs: [
                        { en: "The abandoned Grand Horizon Hotel had stood dark at the edge of the city for over twenty years, its window frames gaping like hollow eye sockets.", vi: "Khách sạn Grand Horizon bị bỏ hoang đã sừng sững trong bóng tối nơi rìa thành phố suốt hơn hai mươi năm, những khung cửa sổ trống hoác như những hốc mắt rỗng tuếch." },
                        { en: "Private Investigator Alan adjusted his flashlight, the beam cutting through the thick dust of the fourth-floor corridor.", vi: "Nhà điều tra tư nhân Alan chỉnh lại chiếc đèn pin, luồng sáng cắt ngang qua lớp bụi đặc quánh của hành lang tầng bốn." },
                        { en: "He was hired to find a missing urban explorer who had vanished three nights ago after entering Room 404.", vi: "Anh được thuê để tìm kiếm một nhà khám phá đô thị bị mất tích ba đêm trước sau khi bước vào Phòng 404." },
                        { en: "The floorboards groaned beneath his boots as he stopped in front of the peeling wooden door marked with rusted copper numbers: 404.", vi: "Những tấm sàn gỗ gầm lên bên dưới đôi ủng của anh khi anh dừng lại trước cánh cửa gỗ bong tróc khắc số đồng gỉ sét: 404." },
                        { en: "Pushing the door open, the hinges shrieked, revealing a room frozen in time, preserved beneath sheets of grey mildew.", vi: "Đẩy cửa mở ra, bản lề rên rỉ, hé lộ một căn phòng như đóng băng qua thời gian, bảo tồn bên dưới những lớp nấm mốc màu xám." },
                        { en: "Dominating the far wall was a massive, ornate Victorian mirror framed in tarnished dark silver.", vi: "Bao phủ bức tường phía xa là một tấm gương phong cách Victoria lớn, chạm khắc cầu kỳ được đóng khung bằng bạc tối xỉn màu." },
                        { en: "Alan approached the mirror, noticing that his reflection took a full second to copy his movements, lagging behind like a delayed shadow.", vi: "Alan tiến lại gần tấm gương, nhận thấy rằng bản sao phản chiếu của anh mất trọn một giây để sao chép các chuyển động của anh, chậm trễ như một cái bóng bị trễ nhịp." },
                        { en: "He rubbed his eyes, thinking it was mere exhaustion, but when he raised his left hand, the reflection raised its right.", vi: "Anh dụi mắt, nghĩ rằng đó chỉ là sự mệt mỏi đơn thuần, nhưng khi anh giơ tay trái lên, hình ảnh phản chiếu lại giơ tay phải." },
                        { en: "A cold chill gripped his spine as the reflection slowly smiled - a twisted, unnatural grin that Alan's own face had not made.", vi: "Một luồng khí lạnh ngắt bóp chặt lấy sống lưng anh khi hình ảnh phản chiếu chậm rãi mỉm cười - một nụ cười méo mó, bất thường mà chính khuôn mặt Alan không hề tạo ra." },
