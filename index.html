                        { en: ""Looking for the lost boy, Detective?" a voice rasped, coming from inside the glass itself.", vi: ""Đang tìm kiếm cậu bé bị mất tích sao, Thám tử?" một giọng nói khàn khàn cất lên, phát ra từ chính bên trong lớp kính." },
                        { en: "The reflection reached out and pressed its palms flat against the inside of the glass surface, leaving foggy handprints from the other side.", vi: "Hình ảnh phản chiếu vươn tay ra và ép phẳng lòng bàn tay vào mặt trong của bề mặt kính, để lại những vết tay mờ sương từ phía bên kia." },
                        { en: "Behind his reflection in the mirrored room, Alan saw the missing explorer, trapped in a shadowy version of Room 404, screaming soundlessly.", vi: "Phía sau hình ảnh phản chiếu của mình trong căn phòng gương, Alan nhìn thấy nhà khám phá bị mất tích, đang bị giam cầm trong một phiên bản bóng tối của Phòng 404, gào thét không cất thành tiếng." },
                        { en: "Alan backed away, drawing his gun, but the glass began to ripple like liquid silver as the entity prepared to step through into reality.", vi: "Alan lùi lại, rút súng ra, nhưng lớp kính bắt đầu gợn sóng như bạc lỏng khi thực thể đó chuẩn bị bước qua để đi vào thực tại." },
                        { en: "Remembering the case file, Alan realized the glass was powered by vanity and fear - it consumed anyone who looked long enough into its depths.", vi: "Nhớ lại hồ sơ vụ án, Alan nhận ra lớp kính được nuôi dưỡng bởi sự phù phiếm và sợ hãi - nó nuốt chửng bất kỳ ai nhìn đủ lâu vào chiều sâu của nó." },
                        { en: "Without hesitation, he spun around, grabbed a heavy brass candle holder from the nightstand, and smashed it squarely into the center of the mirror.", vi: "Không chút chần chừ, anh xoay người lại, vơ lấy chiếc chân nến bằng đồng nặng từ bàn đầu giường và đập mạnh nó vào đúng chính giữa tấm gương." },
                        { en: "The glass shattered with a deafening scream of a thousand trapped souls, fragments raining down like silver snow.", vi: "Tấm gương vỡ tan với một tiếng gào thét xé óc của hàng ngàn linh hồn bị giam giữ, những mảnh vụn trút xuống như tuyết bạc." },
                        { en: "In the heap of broken glass on the floor lay the missing explorer, unconscious but breathing, released from the mirror's eternal trap.", vi: "Trong đống kính vỡ trên sàn nhà là nhà khám phá bị mất tích, đang ngất đi nhưng vẫn còn thở, được giải thoát khỏi cái bẫy vĩnh hằng của tấm gương." }
                    ],
                    messageEn: "Not everything that reflects our image shows our true reality; some illusions exist only to ensnare our souls. Courage often requires shattering comfortable illusions.",
                    messageVi: "Không phải mọi thứ phản chiếu hình ảnh của chúng ta đều hiển thị thực tại chân thật của chúng ta; một số ảo tưởng tồn tại chỉ để bẫy lấy tâm hồn ta. Sự dũng cảm đòi hỏi đập tan ảo tưởng."
                },
                {
                    id: "story-10",
                    category: "mystery",
                    titleEn: "Story 10: The Red Envelope",
                    titleVi: "Câu Chuyện 10: Bao Lì Xì Đỏ",
                    paragraphs: [
                        { en: "The dense mist hanging over the rural village of Maplewood was thick enough to swallow the twilight whole.", vi: "Làn sương mù đặc quánh bao phủ làng quê Maplewood đủ dày để nuốt chửng cả buổi hoàng hôn." },
                        { en: "Kevin, a pragmatic photojournalist from the city, walked along the muddy dirt path, focusing his camera lens on the ancient banyan trees.", vi: "Kevin, một nhà báo ảnh thực tế đến từ thành phố, bước đi trên con đường đất bùn, tập trung ống kính máy ảnh vào những cây đa cổ thụ." },
                        { en: "He had come to document the village's folk traditions, treating every rumor of local spirits with casual skepticism.", vi: "Anh đến để ghi chép lại những phong tục dân gian của ngôi làng, và luôn xem những lời đồn về các linh hồn nơi đây với một thái độ hoài nghi nhưng không quá nghiêm túc." },
                        { en: "Near the edge of a forgotten cemetery, his foot bumped against something tucked beneath a cluster of damp fern leaves.", vi: "Gần mép của một nghĩa trang bị lãng quên, chân anh chạm phải thứ gì đó giấu bên dưới một bụi lá dương xỉ ẩm ướt." },
                        { en: "It was a bright crimson envelope, tied with a gold silk thread and sealed with freshly poured red wax.", vi: "Đó là một bao lì xì đỏ rực rỡ, được buộc bằng sợi chỉ silk vàng và niêm phong bằng lớp sáp đỏ mới đổ." },
                        { en: "Recalling a warning his grandmother once gave him about ghost marriages, Kevin hesitated, knowing the traditional superstition.", vi: "Nhớ lại lời cảnh báo mà bà nội từng trao cho anh về hủ tục minh hôn, Kevin ngập ngừng, biết rõ quan niệm tâm linh truyền thống." },
                        { en: ""Whoever picks up the red envelope accepts a binding contract with the dead," her voice echoed in his memory.", vi: ""Bất kỳ ai nhặt bao lì xì đỏ sẽ chấp nhận một hợp đồng ràng buộc với người chết," giọng bà vang vọng trong ký ức anh." },
                        { en: "Chortling at his own brief hesitation, Kevin picked up the envelope, reasoning that a modern photojournalist shouldn't fear old myths.", vi: "Bật cười trước sự ngập ngừng ngắn ngủi của chính mình, Kevin nhặt bao lì xì lên, tự lý giải rằng một nhà báo ảnh hiện đại không nên sợ những thần thoại cũ." },
                        { en: "Inside the envelope lay a lock of silky black hair and a small piece of parchment bearing a maiden's name and birth date: Eleanor, 1928.", vi: "Bên trong bao lì xì là một lọn tóc đen mượt và một mảnh giấy da nhỏ mang tên và ngày sinh của một thiếu nữ: Eleanor, 1928." },
                        { en: "The moment he tucked the envelope into his jacket pocket, the ambient temperature plummeted, turning his exhaled breath into pale mist.", vi: "Khoảnh khắc anh nhét bao lì xì vào túi áo khoác, nhiệt độ xung quanh giảm mạnh, biến hơi thở ra của anh thành làn sương mờ nhạt." },
                        { en: "That night, at the village inn, Kevin woke up at 3:00 AM to the faint sound of traditional wedding music playing outside his window.", vi: "Đêm đó, tại nhà trọ trong làng, Kevin thức giấc lúc 3 giờ sáng trước âm thanh mờ nhạt của bản nhạc đám cưới truyền thống vang lên bên ngoài cửa sổ." },
                        { en: "The melody was played on wooden flutes and brass gongs, but the notes sounded twisted, heavy, and drenched in sorrow.", vi: "Giai điệu được chơi bằng sáo gỗ và cồng bằng đồng, nhưng những nốt nhạc nghe thật méo mó, nặng nề và đẫm trong sự đau thương." },
                        { en: "He pulled back the curtain and peered out into the moonlit yard.", vi: "Anh kéo rèm cửa ra và nhìn ra khoảng sân ngập ánh trăng." },
                        { en: "A silent procession of figures dressed in traditional wedding attire glided across the grass, their feet hovering inches above the ground.", vi: "Một đoàn người im lìm mặc trang phục đám cưới truyền thống lướt qua bãi cỏ, đôi chân của họ lơ lửng cách mặt đất vài inch." },
                        { en: "At the front of the procession was a pale bride wearing a red silk veil, holding a matched golden thread that stretched directly into Kevin's room.", vi: "Ở đầu đoàn diễu hành là một cô dâu tái nhợt đeo chiếc khăn trùm đầu bằng lụa đỏ, tay cầm một sợi chỉ vàng kéo dài thẳng vào phòng của Kevin." },
                        { en: "Panic seized his chest as the red silk veil slowly lifted, revealing a face devoid of flesh - a porcelain skull with hollow, glowing eyes.", vi: "Sự hoảng loạn bóp chặt lồng ngực anh khi chiếc khăn trùm bằng lụa đỏ chậm rãi nâng lên, hé lộ một khuôn mặt không có thịt - một hộp sọ sứ với đôi mắt rỗng tuếch, phát sáng." },
                        { en: ""You accepted the token, groom," a multi-layered voice echoed inside his mind, vibrating through his teeth and bones.", vi: ""Ngươi đã nhận lấy vật làm tin, chú rể," một giọng nói nhiều tầng vang vọng bên trong tâm trí anh, rung động qua răng và xương của anh." },
                        { en: "Kevin scrambled backward, frantically reaching into his jacket to pull out the crimson envelope to throw it out the window.", vi: "Kevin bò lùi lại, cuống quít thò tay vào áo khoác để rút bao lì xì đỏ ra nhằm ném nó ra ngoài cửa sổ." },
                        { en: "However, the envelope had fused to his palm, the red wax melting directly into his skin like liquid fire.", vi: "Tuy nhiên, bao lì xì đã dính chặt vào lòng bàn tay anh, lớp sáp đỏ tan chảy trực tiếp vào da anh như ngọn lửa lỏng." },
                        { en: "He realized too late that some rituals were not symbolic superstitions, but spiritual traps set to claim living energy for restless souls.", vi: "Anh nhận ra quá muộn rằng một số nghi lễ không phải là sự mê tín mang tính biểu tượng, mà là những cái bẫy tâm linh được giăng ra để đoạt lấy năng lượng của người sống cho những linh hồn không an yên." },
                        { en: "As the door of his room slowly swung open on its own, the freezing mist poured inside, bringing the phantom bridal party into the room.", vi: "Khi cánh cửa phòng anh chậm rãi tự mở ra, làn sương lạnh như băng tràn vào bên trong, đưa đoàn người đám cưới ma quái vào phòng." },
                        { en: "His camera remained on the desk, recording automatically, capturing only the image of an empty room and a red envelope burning on the floor.", vi: "Chiếc máy ảnh của anh vẫn nằm trên bàn làm việc, tự động ghi hình, chỉ chụp được hình ảnh của một căn phòng trống rỗng và một bao lì xì đỏ đang cháy trên sàn nhà." }
                    ],
                    messageEn: "Respect the boundaries of traditions and unseen forces, even when your logic tells you they are mere myths. Curiosity combined with arrogance brings heavy costs.",
                    messageVi: "Hãy tôn trọng ranh giới của truyền thống và những thế lực vô hình, ngay cả khi lý trí bảo bạn rằng chúng chỉ là những câu chuyện hoang đường. Sự tò mò kiêu ngạo mang đến cái giá rất đắt."
                }
            ]
        };

        // Application State Management
        let currentIndex = 0; // 0 = Intro, 1..10 = Stories
        let currentMode = 'dual'; // 'dual', 'en', 'vi'
        let currentTheme = 'dark';
        let currentFontSize = 17;
        let ttsSpeed = 0.9;
        let isAutoPlaying = false;
        let speechSynth = window.speechSynthesis;
        let currentUtterance = null;

        // Combine dataset into a flat index array
        const allItems = [ebookData.intro, ...ebookData.stories];

        // DOM Elements
        const tocContainer = document.getElementById('toc-container');
        const storyContent = document.getElementById('story-content');
        const readerViewport = document.getElementById('reader-viewport');
        const readingProgress = document.getElementById('reading-progress');
        const storyIndexIndicator = document.getElementById('story-index-indicator');
        const settingsModal = document.getElementById('settings-modal');
        const sidebar = document.getElementById('sidebar');

        // Initialize App
        function initApp() {
            renderTOC();
            loadItem(0);
            setupEventListeners();
            updateProgress();
        }

        // Render Table of Contents
        function renderTOC() {
            let html = '';
            
            // Introduction Item
            html += `
                <div class="toc-item active" data-index="0">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Lời Giới Thiệu</span>
                </div>
            `;

            // Part 1 Section
            html += `<div class="toc-section-title"><i class="fa-solid fa-heart"></i> Phần 1: Tình Cảm & Cuộc Sống</div>`;
            for (let i = 1; i <= 5; i++) {
                const item = allItems[i];
                html += `
                    <div class="toc-item" data-index="${i}">
                        <i class="fa-solid fa-book-bookmark" style="color: #10b981;"></i>
                        <span>${item.titleVi.split(': ')[1]}</span>
                    </div>
                `;
            }

            // Part 2 Section
            html += `<div class="toc-section-title"><i class="fa-solid fa-ghost"></i> Phần 2: Tâm Linh & Trinh Thám</div>`;
            for (let i = 6; i <= 10; i++) {
                const item = allItems[i];
                html += `
                    <div class="toc-item" data-index="${i}">
                        <i class="fa-solid fa-mask" style="color: #a855f7;"></i>
                        <span>${item.titleVi.split(': ')[1]}</span>
                    </div>
                `;
            }

            tocContainer.innerHTML = html;
        }

        // Load Story or Intro into Viewport
        function loadItem(index) {
            stopSpeech();
            currentIndex = index;
            const item = allItems[index];

            // Update TOC styling
            document.querySelectorAll('.toc-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.index) === index);
            });

            // Update Header Tags and Titles
            let tagHtml = '';
            if (item.category === 'life') {
                tagHtml = `<span class="story-tag tag-life"><i class="fa-solid fa-leaf"></i> Tình Cảm & Cuộc Sống</span>`;
            } else if (item.category === 'mystery') {
                tagHtml = `<span class="story-tag tag-mystery"><i class="fa-solid fa-user-secret"></i> Tâm Linh & Trinh Thám</span>`;
            } else {
                tagHtml = `<span class="story-tag" style="background: rgba(99,102,241,0.15); color: #818cf8;"><i class="fa-solid fa-star"></i> Giới Thiệu</span>`;
            }

            let paragraphsHtml = '';
            item.paragraphs.forEach((p, pIdx) => {
                paragraphsHtml += `
                    <div class="para-block" data-pidx="${pIdx}">
                        <span class="para-en">${p.en}</span>
                        <span class="para-vi">${p.vi}</span>
                        <div class="audio-indicator"><i class="fa-solid fa-volume-high"></i></div>
                    </div>
                `;
            });

            let messageBoxHtml = '';
            if (item.messageEn) {
                messageBoxHtml = `
                    <div class="message-box">
                        <div class="message-title"><i class="fa-solid fa-gem"></i> Thông Điệp / Moral Message</div>
                        <div class="para-en" style="font-weight: 600; color: var(--text-main);">${item.messageEn}</div>
                        <div class="para-vi" style="margin-top: 6px;">${item.messageVi}</div>
                    </div>
                `;
            }

            storyContent.innerHTML = `
                <div class="story-header">
                    ${tagHtml}
                    <h1 class="story-title-en">${item.titleEn}</h1>
                    <h2 class="story-title-vi">${item.titleVi}</h2>
                </div>
                <div class="story-body">
                    ${paragraphsHtml}
                </div>
                ${messageBoxHtml}
            `;

            // Update Index Bar
            storyIndexIndicator.textContent = index === 0 ? "Lời Giới Thiệu" : `Truyện ${index} / 10`;

            // Reset Scroll
            readerViewport.scrollTop = 0;
            updateProgress();

            // Re-apply display mode classes
            applyDisplayMode();
        }

        // Speech Synthesis Implementation
        function speakParagraph(pIdx, callback = null) {
            stopSpeech();
            const item = allItems[currentIndex];
            const p = item.paragraphs[pIdx];
            if (!p) return;

            // Highlight Paragraph Block
            const blocks = storyContent.querySelectorAll('.para-block');
            blocks.forEach(b => b.classList.remove('speaking'));
            if (blocks[pIdx]) {
                blocks[pIdx].classList.add('speaking');
                blocks[pIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            let textToSpeak = p.en; // Speak English default
            let lang = 'en-US';

            // If VI mode is strictly on, speak Vietnamese
            if (currentMode === 'vi') {
                textToSpeak = p.vi;
                lang = 'vi-VN';
            }

            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            currentUtterance.lang = lang;
            currentUtterance.rate = ttsSpeed;

            currentUtterance.onend = () => {
                if (blocks[pIdx]) blocks[pIdx].classList.remove('speaking');
                if (callback) callback();
            };

            currentUtterance.onerror = () => {
                if (blocks[pIdx]) blocks[pIdx].classList.remove('speaking');
                if (callback) callback();
            };

            speechSynth.speak(currentUtterance);
        }

        function stopSpeech() {
            if (speechSynth.speaking) {
                speechSynth.cancel();
            }
            document.querySelectorAll('.para-block').forEach(b => b.classList.remove('speaking'));
        }

        // Auto Play Reader Feature
        let autoPlayCurrentIdx = 0;
        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('auto-play-toggle');
            const icon = document.getElementById('auto-play-icon');
            const text = document.getElementById('auto-play-text');

            if (isAutoPlaying) {
                btn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
                icon.className = 'fa-solid fa-pause';
                text.textContent = 'Dừng Đọc';
                autoPlayCurrentIdx = 0;
                playNextAutoStep();
            } else {
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                icon.className = 'fa-solid fa-play';
                text.textContent = 'Tự Động Đọc';
                stopSpeech();
            }
        }

        function playNextAutoStep() {
            if (!isAutoPlaying) return;
            const item = allItems[currentIndex];

            if (autoPlayCurrentIdx < item.paragraphs.length) {
                speakParagraph(autoPlayCurrentIdx, () => {
                    autoPlayCurrentIdx++;
                    setTimeout(playNextAutoStep, 400);
                });
            } else {
                // Story finished, move to next story
                if (currentIndex < allItems.length - 1) {
                    loadItem(currentIndex + 1);
                    autoPlayCurrentIdx = 0;
                    setTimeout(playNextAutoStep, 1000);
                } else {
                    toggleAutoPlay(); // Stop at end of book
                }
            }
        }

        // Update Reading Progress Bar
        function updateProgress() {
            const totalScroll = readerViewport.scrollHeight - readerViewport.clientHeight;
            if (totalScroll <= 0) {
                readingProgress.style.width = '100%';
                return;
            }
            const currentScroll = readerViewport.scrollTop;
            const percentage = (currentScroll / totalScroll) * 100;
            readingProgress.style.width = `${percentage}%`;
        }

        // Apply Mode (Dual / EN / VI)
        function applyDisplayMode() {
            readerViewport.classList.remove('mode-en-only', 'mode-vi-only');
            if (currentMode === 'en') readerViewport.classList.add('mode-en-only');
            if (currentMode === 'vi') readerViewport.classList.add('mode-vi-only');
        }

        // Event Listeners Setup
        function setupEventListeners() {
            // TOC Click
            tocContainer.addEventListener('click', (e) => {
                const itemEl = e.target.closest('.toc-item');
                if (itemEl) {
                    const idx = parseInt(itemEl.dataset.index);
                    loadItem(idx);
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // Paragraph Audio Tap Event
            storyContent.addEventListener('click', (e) => {
                const block = e.target.closest('.para-block');
                if (block) {
                    const pIdx = parseInt(block.dataset.pidx);
                    speakParagraph(pIdx);
                }
            });

            // Mode Switcher Buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    applyDisplayMode();
                });
            });

            // Next / Prev Story Buttons
            document.getElementById('prev-story-btn').addEventListener('click', () => {
                if (currentIndex > 0) loadItem(currentIndex - 1);
            });

            document.getElementById('next-story-btn').addEventListener('click', () => {
                if (currentIndex < allItems.length - 1) loadItem(currentIndex + 1);
            });

            // Auto Play Trigger
            document.getElementById('auto-play-toggle').addEventListener('click', toggleAutoPlay);

            // Scroll Progress Listener
            readerViewport.addEventListener('scroll', updateProgress);

            // Sidebar Toggle
            document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            // Settings Modal Listeners
            const settingsBtn = document.getElementById('settings-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');

            settingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));
            closeModalBtn.addEventListener('click', () => settingsModal.classList.remove('open'));

            // Theme Buttons Inside Modal
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTheme = btn.dataset.theme;
                    document.body.className = `theme-${currentTheme}`;
                });
            });

            // Font Size Slider
            const fontSizeSlider = document.getElementById('font-size-slider');
            fontSizeSlider.addEventListener('input', (e) => {
                currentFontSize = e.target.value;
                document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
            });

            // TTS Speed Slider
            const ttsSpeedSlider = document.getElementById('tts-rate-slider');
            ttsSpeedSlider.addEventListener('input', (e) => {
                ttsSpeed = parseFloat(e.target.value);
            });
        }

        // Initialize App on DOM Loaded
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
